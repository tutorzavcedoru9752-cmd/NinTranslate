name: Build desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Build native RapidOCR runtime
        run: |
          python -m pip install -r scripts/rapidocr-requirements.txt
          npm run build:rapidocr

      - name: Run automated tests
        run: npm test -- --run

      - name: Run multilingual OCR fixtures
        run: npm run test:ocr

      - name: Build macOS package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac -- --${{ matrix.arch }}

      - name: Verify packaged core resources
        run: |
          test -n "$(find release -path '*/NinTranslate.app/Contents/Resources/brand/nintranslate-app-icon.png' -print -quit)"
          grep -q "settings:test" dist-electron/main/main.js
          APP_RESOURCES="$(find release -path '*/NinTranslate.app/Contents/Resources' -type d -print -quit)"
          for model in ch_PP-LCNet_x0_25_textline_ori_cls_mobile ch_PP-OCRv5_det_mobile ch_PP-OCRv5_rec_mobile eslav_PP-OCRv5_rec_mobile korean_PP-OCRv5_rec_mobile latin_PP-OCRv5_rec_mobile; do
            test -f "$APP_RESOURCES/rapidocr/models/$model.onnx"
          done
          test -x "$APP_RESOURCES/rapidocr/runtime/darwin-${{ matrix.arch }}/rapidocr-sidecar/rapidocr-sidecar"

      - name: Create checksums
        run: |
          cd release
          shasum -a 256 NinTranslate-*-macOS-${{ matrix.arch }}.dmg NinTranslate-*-macOS-${{ matrix.arch }}.zip > SHA256SUMS-macOS-${{ matrix.arch }}.txt

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: NinTranslate-macOS-${{ matrix.arch }}
          path: |
            release/NinTranslate-*-macOS-${{ matrix.arch }}.dmg
            release/NinTranslate-*-macOS-${{ matrix.arch }}.zip
            release/SHA256SUMS-macOS-${{ matrix.arch }}.txt
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Build native RapidOCR runtime
        shell: pwsh
        run: |
          python -m pip install -r scripts/rapidocr-requirements.txt
          npm run build:rapidocr

      - name: Run automated tests
        run: npm test -- --run

      - name: Run multilingual OCR fixtures
        run: npm run test:ocr

      - name: Prepare verified Windows packaging tools
        shell: pwsh
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP 'nintranslate-builder-tools'
          $nsisDir = Join-Path $toolRoot 'nsis'
          $resourcesDir = Join-Path $toolRoot 'nsis-resources'
          $sevenZipDir = Join-Path $toolRoot '7zip'
          New-Item -ItemType Directory -Force -Path $nsisDir,$resourcesDir,$sevenZipDir | Out-Null

          function Get-VerifiedTool($url, $destination, $sha256) {
            curl.exe --fail --location --retry 10 --retry-delay 3 --retry-all-errors --connect-timeout 20 $url --output $destination
            if ($LASTEXITCODE -ne 0) { throw "Failed to download $url" }
            $actual = (Get-FileHash $destination -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $sha256) { throw "Checksum mismatch for $destination" }
          }

          $nsisArchive = Join-Path $toolRoot 'nsis-3.0.4.1.7z'
          $resourcesArchive = Join-Path $toolRoot 'nsis-resources-3.4.1.7z'
          $sevenZipArchive = Join-Path $toolRoot '7zip-win-x64.tar.gz'
          Get-VerifiedTool 'https://github.com/electron-userland/electron-builder-binaries/releases/download/nsis-3.0.4.1/nsis-3.0.4.1.7z' $nsisArchive '9877df902530f96357d13a7a31ae2b9df67f48b11ffc9a1700a7c961574ec5fa'
          Get-VerifiedTool 'https://github.com/electron-userland/electron-builder-binaries/releases/download/nsis-resources-3.4.1/nsis-resources-3.4.1.7z' $resourcesArchive '593a9a92ef958321293ac6a2ee61e64bf1bd543142a5bd6b3d310709cc924103'
          Get-VerifiedTool 'https://github.com/electron-userland/electron-builder-binaries/releases/download/7zip%401.0.0/7zip-win-x64.tar.gz' $sevenZipArchive 'be071f15bd6da2f78fe81c6ddef2009b0c4d8a51f36b780cb806c7e6df95e1b3'

          7z x $nsisArchive "-o$nsisDir" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Failed to extract NSIS' }
          7z x $resourcesArchive "-o$resourcesDir" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Failed to extract NSIS resources' }
          tar -xzf $sevenZipArchive -C $toolRoot
          if ($LASTEXITCODE -ne 0) { throw 'Failed to extract 7zip toolset' }

          $sevenZipPath = Join-Path $sevenZipDir 'bin/7za.exe'
          if (-not (Test-Path (Join-Path $nsisDir 'Bin/makensis.exe'))) { throw 'NSIS executable is missing after extraction' }
          if (-not (Test-Path (Join-Path $resourcesDir 'plugins'))) { throw 'NSIS plugins are missing after extraction' }
          if (-not (Test-Path $sevenZipPath)) { throw '7zip executable is missing after extraction' }

          "ELECTRON_BUILDER_NSIS_DIR=$nsisDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ELECTRON_BUILDER_NSIS_RESOURCES_DIR=$resourcesDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ELECTRON_BUILDER_7ZIP_PATH=$sevenZipPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows packages
        shell: pwsh
        run: |
          npm run dist:win 2>&1 | Tee-Object -FilePath windows-packaging.log
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            $tail = (Get-Content windows-packaging.log -Tail 80 | ForEach-Object { $_ -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A' }) -join '%0A'
            Write-Output "::error title=Windows packaging failed::$tail"
            exit $buildExitCode
          }

      - name: Verify packaged core resources
        shell: pwsh
        run: |
          $models = 'ch_PP-LCNet_x0_25_textline_ori_cls_mobile','ch_PP-OCRv5_det_mobile','ch_PP-OCRv5_rec_mobile','eslav_PP-OCRv5_rec_mobile','korean_PP-OCRv5_rec_mobile','latin_PP-OCRv5_rec_mobile'
          foreach ($model in $models) {
            if (-not (Test-Path "release/win-unpacked/resources/rapidocr/models/$model.onnx")) {
              throw "Missing packaged RapidOCR model: $model"
            }
          }
          if (-not (Test-Path 'release/win-unpacked/resources/rapidocr/runtime/win32-x64/rapidocr-sidecar/rapidocr-sidecar.exe')) {
            throw 'Missing packaged Windows RapidOCR runtime'
          }
          if (-not (Select-String -Quiet -Path dist-electron/main/main.js -Pattern 'result:set-target')) {
            throw 'Missing result:set-target IPC handler'
          }

      - name: Create checksums
        shell: pwsh
        run: |
          Get-FileHash release/NinTranslate-Setup-x64.exe,release/NinTranslate-Portable-x64.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content -Encoding ascii release/SHA256SUMS-Windows-x64.txt

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: NinTranslate-Windows-x64
          path: |
            release/NinTranslate-Setup-x64.exe
            release/NinTranslate-Portable-x64.exe
            release/SHA256SUMS-Windows-x64.txt
          if-no-files-found: error

  release:
    name: Publish tagged desktop release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: NinTranslate-*
          path: release
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "NinTranslate ${GITHUB_REF_NAME#v} · RapidOCR 截图翻译" \
            --notes "本地 OCR 已升级为 RapidOCR 与 PaddleOCR PP-OCRv5 多语言模型；新增跨行语义整理，改善被界面换行截断的整句翻译；修复深色模式下拉框可读性。提供 Windows 安装版/便携版，以及 macOS Apple 芯片 arm64/Intel x64 安装包。macOS 当前仍为未使用 Apple Developer 证书签名的测试版。"
