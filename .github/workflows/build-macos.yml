name: Build macOS packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - x64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test -- --run

      - name: Build macOS package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac -- --${{ matrix.arch }}

      - name: Create checksums
        run: |
          cd release
          shasum -a 256 NinTranslate-*-macOS-${{ matrix.arch }}.dmg NinTranslate-*-macOS-${{ matrix.arch }}.zip > SHA256SUMS-macOS-${{ matrix.arch }}.txt

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: NinTranslate-macOS-${{ matrix.arch }}
          path: |
            release/NinTranslate-*-macOS-${{ matrix.arch }}.dmg
            release/NinTranslate-*-macOS-${{ matrix.arch }}.zip
            release/SHA256SUMS-macOS-${{ matrix.arch }}.txt
          if-no-files-found: error
