name: Build macOS packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - x64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test -- --run

      - name: Build macOS package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac -- --${{ matrix.arch }}

      - name: Create checksums
        run: |
          cd release
          shasum -a 256 NinTranslate-*-macOS-${{ matrix.arch }}.dmg NinTranslate-*-macOS-${{ matrix.arch }}.zip > SHA256SUMS-macOS-${{ matrix.arch }}.txt

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: NinTranslate-macOS-${{ matrix.arch }}
          path: |
            release/NinTranslate-*-macOS-${{ matrix.arch }}.dmg
            release/NinTranslate-*-macOS-${{ matrix.arch }}.zip
            release/SHA256SUMS-macOS-${{ matrix.arch }}.txt
          if-no-files-found: error

  release:
    name: Publish tagged macOS release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download both architecture packages
        uses: actions/download-artifact@v4
        with:
          pattern: NinTranslate-macOS-*
          path: release
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "NinTranslate ${GITHUB_REF_NAME#v} · macOS 原生版" \
            --notes "提供 Apple 芯片 arm64 与 Intel x64 的 DMG 安装包和 ZIP 备用包。首次截图需在系统设置中允许屏幕录制。当前为未使用 Apple Developer 证书签名的测试版，请阅读仓库中的《macOS使用说明》。"
